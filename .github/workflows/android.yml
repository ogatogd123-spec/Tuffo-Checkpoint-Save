
name: Build Tuffo Checkpoints Save

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android 64-bit
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          build-config: Release

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Tuffo-Checkpoints-Save-Android64
          path: output/*.geode
          
